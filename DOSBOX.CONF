# EIN. MEER. VON. SAND. -- DOSBox settings
# Start with:  dosbox -conf DOSBOX.CONF   (from the folder that holds SAND.EXE and SAND.SND)

[sdl]
fullscreen=false
output=opengl

[render]
aspect=true
scaler=normal3x

[cpu]
core=dynamic
cputype=auto
cycles=max

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=auto

[mixer]
rate=44100

[autoexec]
mount c .
c:
SAND.EXE
